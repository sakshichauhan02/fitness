<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | FitAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    
    .card {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .icon-container {
      width: 80px;
      height: 80px;
      background-color: #e0e7ff;
      border: 1px solid #c7d2fe;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      color: var(--primary);
      position: relative;
    }
    
    .icon-container svg {
      width: 40px;
      height: 40px;
    }
    
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #c7d2fe;
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
      opacity: 0;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { opacity: 0.3; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 0.75rem;
    }
    
    p {
      font-size: 0.875rem;
      color: var(--slate-600);
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    
    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      background-color: var(--slate-100);
      border: 1px solid var(--slate-200);
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--slate-600);
      margin-top: 1.5rem;
    }
    
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: blink 1s infinite alternate;
    }
    
    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <div class="pulse-ring"></div>
      <!-- Cloud Offline Lucide SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/>
        <path d="M2 2l20 20"/>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>FitAI was unable to establish a connection to the server. Don't worry! Your cached workout data, daily macro allocations, and profile targets remain accessible. Any new entries will automatically sync when your connection is restored.</p>
    
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    
    <div class="status-badge">
      <span class="status-dot"></span>
      Offline Mode Active
    </div>
  </div>
</body>
</html>
